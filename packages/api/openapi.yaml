openapi: 3.1.0

info:
  title: Restaurant Discovery API
  version: 1.0.0
  description: REST API for restaurant discovery, reviews, favorites, ownership requests, owner management, and admin moderation.

servers:
  - url: /api
    description: Default server

tags:
  - name: Auth
    description: Authentication and session management

  - name: Restaurants
    description: Restaurant brands and public discovery

  - name: Branches
    description: Physical restaurant branches

  - name: Reviews
    description: Customer reviews for branches

  - name: Images
    description: Branch images

  - name: Favorites
    description: Saved restaurants

  - name: Restaurant Claims
    description: Restaurant ownership requests

  - name: Owner
    description: Restaurant owner management

  - name: Admin
    description: Admin moderation and management

# ─── Reusable components ───────────────────────────────────────────────────────
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
      description: HttpOnly access token cookie set on login

  schemas:
    RegisterBody:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 8
          description: Must contain at least one uppercase letter and one number
          example: Password1
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Jane Doe

    LoginBody:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 1
          example: Password1

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        email:
          type: string
          format: email
          example: user@example.com
        name:
          type: string
          example: Jane Doe
        role:
          type: string
          enum: [user, admin]
          example: user
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Invalid credentials

    MessageResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            message:
              type: string
              example: Success

    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Validation failed
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: email
              message:
                type: string
                example: Invalid email address

    Restaurant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Pizza Hut
        description:
          type: string
        cuisineType:
          type: string
          example: Italian
        priceRange:
          type: string
          enum: [$, $$, $$$, $$$$]
          example: $$
        verified:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Branch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        restaurantId:
          type: string
          format: uuid
        name:
          type: string
          example: Beirut Branch
        address:
          type: string
        city:
          type: string
          example: Beirut
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        phone:
          type: string
        openingHours:
          type: object
          example:
            monday: "09:00-23:00"
            tuesday: "09:00-23:00"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
paths:
  # ============================================================================
  # USER / AUTH
  # ============================================================================

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive authentication cookies
      operationId: login
      description: >
        On successful login, the API sets HttpOnly accessToken and refreshToken
        cookies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh the access token
      operationId: refreshToken
      description: >
        Reads the refreshToken cookie and issues new authentication cookies.
      responses:
        "200":
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Missing or invalid refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout and clear authentication cookies
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the current authenticated user
      operationId: getMe
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    /auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify a user's email address
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Email verification data.
      responses:
        "200":
          description: Email verified successfully
        "400":
          description: Invalid or expired verification data
        "422":
          description: Validation error

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Password reset request data.
      responses:
        "200":
          description: Password reset request processed
        "422":
          description: Validation error

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset a user's password
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Password reset data.
      responses:
        "200":
          description: Password reset successfully
        "400":
          description: Invalid or expired reset token
        "422":
          description: Validation error

  /auth/resend-verification:
    post:
      tags: [Auth]
      summary: Resend email verification
      operationId: resendVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Email address for resending verification.
      responses:
        "200":
          description: Verification email sent
        "422":
          description: Validation error

  # ============================================================================
  # USER / RESTAURANTS
  # ============================================================================

  /restaurants:
    get:
      tags: [Restaurants]
      summary: Get all restaurants
      operationId: getRestaurants
      responses:
        "200":
          description: List of restaurants

  /restaurants/{restaurantId}:
    get:
      tags: [Restaurants]
      summary: Get restaurant details
      operationId: getRestaurant
      parameters:
        - in: path
          name: restaurantId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Restaurant details
        "404":
          description: Restaurant not found

  /restaurants/{restaurantId}/branches:
    get:
      tags: [Branches]
      summary: Get branches for a restaurant
      operationId: getRestaurantBranches
      parameters:
        - in: path
          name: restaurantId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of branches
        "404":
          description: Restaurant not found

  # ============================================================================
  # USER / BRANCHES
  # ============================================================================

  /branches/{branchId}:
    get:
      tags: [Branches]
      summary: Get branch details
      operationId: getBranch
      parameters:
        - in: path
          name: branchId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Branch details
        "404":
          description: Branch not found

  # ============================================================================
  # USER / REVIEWS
  # ============================================================================

  /branches/{branchId}/reviews:
    get:
      tags: [Reviews]
      summary: Get reviews for a branch
      operationId: getBranchReviews
      parameters:
        - in: path
          name: branchId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of reviews
        "404":
          description: Branch not found

    post:
      tags: [Reviews]
      summary: Create a review for a branch
      operationId: createReview
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: branchId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rating
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                  example: 5
                comment:
                  type: string
                  example: The pasta was amazing.
      responses:
        "201":
          description: Review created
        "401":
          description: Unauthorized
        "422":
          description: Validation error

  /reviews/{reviewId}:
    patch:
      tags: [Reviews]
      summary: Update my review
      operationId: updateReview
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                  example: 4
                comment:
                  type: string
                  example: Good food, but service was slow.
      responses:
        "200":
          description: Review updated
        "401":
          description: Unauthorized
        "403":
          description: Cannot edit another user's review
        "404":
          description: Review not found

    delete:
      tags: [Reviews]
      summary: Delete my review
      operationId: deleteReview
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Review deleted
        "401":
          description: Unauthorized
        "403":
          description: Cannot delete another user's review
        "404":
          description: Review not found

  # ============================================================================
  # USER / FAVORITES
  # ============================================================================

  /favorites:
    get:
      tags: [Favorites]
      summary: Get my favorite restaurants
      operationId: getFavorites
      security:
        - cookieAuth: []
      responses:
        "200":
          description: List of favorite restaurants
        "401":
          description: Unauthorized

  /favorites/{restaurantId}:
    post:
      tags: [Favorites]
      summary: Add a restaurant to favorites
      operationId: addFavorite
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: restaurantId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Restaurant added to favorites
        "401":
          description: Unauthorized

    delete:
      tags: [Favorites]
      summary: Remove a restaurant from favorites
      operationId: removeFavorite
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: restaurantId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Restaurant removed from favorites
        "401":
          description: Unauthorized

  # ============================================================================
  # USER / RESTAURANT CLAIMS
  # ============================================================================

  /restaurant-claims:
    post:
      tags: [Restaurant Claims]
      summary: Submit a restaurant ownership request
      operationId: createRestaurantClaim
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Restaurant ownership claim request.
      responses:
        "201":
          description: Ownership request submitted
        "401":
          description: Unauthorized
        "422":
          description: Validation error

    get:
      tags: [Restaurant Claims]
      summary: Get my restaurant ownership request
      operationId: getMyRestaurantClaim
      description: >
        Returns the authenticated owner's restaurant ownership request.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Ownership request retrieved
        "401":
          description: Unauthorized
        "403":
          description: User is not an owner

  # ============================================================================
  # OWNER / RESTAURANT
  # ============================================================================

  /owner/restaurants:
    post:
      tags: [Owner]
      summary: Create a restaurant
      operationId: ownerCreateRestaurant
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: Restaurant information and optional restaurant image.
      responses:
        "201":
          description: Restaurant created
        "401":
          description: Unauthorized
        "403":
          description: User is not an owner
        "422":
          description: Validation error

  /owner/restaurants/{restaurantSlug}:
    get:
      tags: [Owner]
      summary: Get owned restaurant
      operationId: ownerGetRestaurant
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: restaurantSlug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Restaurant details
        "401":
          description: Unauthorized
        "403":
          description: User does not own this restaurant
        "404":
          description: Restaurant not found

    patch:
      tags: [Owner]
      summary: Update owned restaurant
      operationId: ownerUpdateRestaurant
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: restaurantSlug
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: Updated restaurant information and optional image.
      responses:
        "200":
          description: Restaurant updated
        "401":
          description: Unauthorized
        "403":
          description: User does not own this restaurant
        "404":
          description: Restaurant not found
        "422":
          description: Validation error

  # ============================================================================
  # OWNER / BRANCHES
  # ============================================================================

  /owner/restaurants/{restaurantSlug}/branches:
    post:
      tags: [Owner]
      summary: Create a branch for an owned restaurant
      operationId: ownerCreateBranch
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: restaurantSlug
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: Branch information and branch images.
      responses:
        "201":
          description: Branch created
        "401":
          description: Unauthorized
        "403":
          description: User does not own this restaurant
        "404":
          description: Restaurant not found
        "422":
          description: Validation error

    get:
      tags: [Owner]
      summary: Get all branches for an owned restaurant
      operationId: ownerGetBranches
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: restaurantSlug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of branches
        "401":
          description: Unauthorized
        "403":
          description: User does not own this restaurant
        "404":
          description: Restaurant not found

  /owner/restaurants/{restaurantSlug}/branches/{branchSlug}:
    get:
      tags: [Owner]
      summary: Get an owned restaurant branch
      operationId: ownerGetBranch
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: restaurantSlug
          required: true
          schema:
            type: string
        - in: path
          name: branchSlug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Branch details
        "401":
          description: Unauthorized
        "403":
          description: User does not own this restaurant
        "404":
          description: Branch not found

    patch:
      tags: [Owner]
      summary: Update an owned restaurant branch
      operationId: ownerUpdateBranch
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: restaurantSlug
          required: true
          schema:
            type: string
        - in: path
          name: branchSlug
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: Updated branch information, images, and deleted image IDs.
      responses:
        "200":
          description: Branch updated
        "401":
          description: Unauthorized
        "403":
          description: User does not own this restaurant
        "404":
          description: Branch not found
        "422":
          description: Validation error

    delete:
      tags: [Owner]
      summary: Delete an owned restaurant branch
      operationId: ownerDeleteBranch
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: restaurantSlug
          required: true
          schema:
            type: string
        - in: path
          name: branchSlug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Branch deleted
        "401":
          description: Unauthorized
        "403":
          description: User does not own this restaurant
        "404":
          description: Branch not found

  # ============================================================================
  # OWNER / MENUS
  # ============================================================================

  /owner/restaurants/{restaurantSlug}/menus:
    post:
      tags: [Owner]
      summary: Create a menu
      operationId: ownerCreateMenu
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: restaurantSlug
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: Menu information, optional image, and menu items.
      responses:
        "201":
          description: Menu created
        "401":
          description: Unauthorized
        "403":
          description: User does not own this restaurant
        "422":
          description: Validation error

    get:
      tags: [Owner]
      summary: Get menus for an owned restaurant
      operationId: ownerGetRestaurantMenus
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: restaurantSlug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of restaurant menus
        "401":
          description: Unauthorized
        "403":
          description: User does not own this restaurant
        "404":
          description: Restaurant not found

  /owner/restaurants/{restaurantSlug}/branches/{branchSlug}/menus:
    get:
      tags: [Owner]
      summary: Get menus for an owned restaurant branch
      operationId: ownerGetBranchMenus
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: restaurantSlug
          required: true
          schema:
            type: string
        - in: path
          name: branchSlug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of branch menus
        "401":
          description: Unauthorized
        "403":
          description: User does not own this restaurant
        "404":
          description: Branch not found

  /owner/restaurants/{restaurantSlug}/branches/{branchSlug}/menu-items/{menuItemId}:
    patch:
      tags: [Owner]
      summary: Override a branch menu item
      operationId: ownerOverrideBranchMenuItem
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: restaurantSlug
          required: true
          schema:
            type: string
        - in: path
          name: branchSlug
          required: true
          schema:
            type: string
        - in: path
          name: menuItemId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Branch-specific menu item override.
      responses:
        "200":
          description: Branch menu item updated
        "401":
          description: Unauthorized
        "403":
          description: User does not own this restaurant
        "404":
          description: Menu item or branch not found
        "422":
          description: Validation error

  /owner/restaurants/{restaurantSlug}/menus/{menuId}:
    patch:
      tags: [Owner]
      summary: Update a menu
      operationId: ownerUpdateMenu
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: restaurantSlug
          required: true
          schema:
            type: string
        - in: path
          name: menuId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Updated menu information.
      responses:
        "200":
          description: Menu updated
        "401":
          description: Unauthorized
        "403":
          description: User does not own this restaurant
        "404":
          description: Menu not found
        "422":
          description: Validation error

    delete:
      tags: [Owner]
      summary: Delete a menu
      operationId: ownerDeleteMenu
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: restaurantSlug
          required: true
          schema:
            type: string
        - in: path
          name: menuId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Menu deleted
        "401":
          description: Unauthorized
        "403":
          description: User does not own this restaurant
        "404":
          description: Menu not found

    post:
      tags: [Owner]
      summary: Add a menu item to a menu
      operationId: ownerAddMenuItem
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: restaurantSlug
          required: true
          schema:
            type: string
        - in: path
          name: menuId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: Menu item information and optional image.
      responses:
        "201":
          description: Menu item added
        "401":
          description: Unauthorized
        "403":
          description: User does not own this restaurant
        "404":
          description: Menu not found
        "422":
          description: Validation error

  /owner/restaurants/{restaurantSlug}/menus/{menuId}/menu-items/{menuItemId}:
    patch:
      tags: [Owner]
      summary: Update a menu item
      operationId: ownerUpdateMenuItem
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: restaurantSlug
          required: true
          schema:
            type: string
        - in: path
          name: menuId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: menuItemId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: Updated menu item information and optional image.
      responses:
        "200":
          description: Menu item updated
        "401":
          description: Unauthorized
        "403":
          description: User does not own this restaurant
        "404":
          description: Menu item not found
        "422":
          description: Validation error

